<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CIFAR-10 Görsel Tanıma</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f7fa;
        }
        .container {
            margin-top: 50px;
        }
        .image-preview {
            max-width: 300px;
            max-height: 300px;
            border: 2px solid #ccc;
            padding: 10px;
            background-color: white;
        }
    </style>
</head>
<body>
<div class="container text-center">
    <h1 class="mb-4">🧠 CIFAR-10 Görsel Sınıflandırma</h1>
    <form method="POST" enctype="multipart/form-data" class="mb-4">
        <div class="mb-3">
            <input type="file" class="form-control" name="image" accept="image/*" required>
        </div>
        <button type="submit" class="btn btn-primary">Yükle ve Tahmin Et</button>
    </form>

    {% if image_path %}
        <div class="mb-3">
            <h4>Yüklenen Görsel:</h4>
            <img src="{{ image_path }}" class="image-preview img-fluid rounded shadow">
        </div>
    {% endif %}

    {% if prediction %}
        <div class="alert alert-success mt-4">
            <h4>{{ prediction }}</h4>
        </div>
    {% endif %}
</div>
</body>
</html>
